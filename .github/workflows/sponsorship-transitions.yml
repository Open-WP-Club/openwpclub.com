name: Refresh sponsorship transitions
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: website-data-refresh
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: refresh
        run: node scripts/refresh-sponsorship.mjs >> "$GITHUB_OUTPUT"
      - id: commit
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sponsorship-state.json
          git commit -m "Refresh active sponsorship positions"
          git pull --rebase origin main
          git push origin main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/publish-site.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
