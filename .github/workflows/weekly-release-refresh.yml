name: Weekly release refresh

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Fetch latest releases
        run: node scripts/fetch-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changed release data
        run: |
          git add src/data/releases.json src/data/freshness.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh repository releases"
          git pull --rebase
          git push
